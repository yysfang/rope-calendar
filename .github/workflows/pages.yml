name: Publish rope calendar

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'scripts/**'
      - 'package*.json'
      - 'index.html'
      - '*.config.mjs'
      - 'tsconfig.json'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
    inputs:
      force_publish:
        description: Republish the current site build
        type: boolean
        default: false

permissions:
  contents: write
  pages: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
      - name: Save complete updated catalog
        run: |
          if [ -n "$(git status --porcelain -- public/regulations src/data/seed.json)" ]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add public/regulations src/data/seed.json
            git commit -m 'Update competition calendar and regulation files'
            git push
          fi
      - name: Publish compiled site from branch
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE_PUBLISH: ${{ inputs.force_publish }}
        run: |
          git fetch origin gh-pages
          publish_dir="$RUNNER_TEMP/rope-calendar-pages"
          git worktree add --detach "$publish_dir" origin/gh-pages
          mkdir -p "$publish_dir/docs"
          rsync -a --delete dist/ "$publish_dir/docs/"
          touch "$publish_dir/docs/.nojekyll"
          git -C "$publish_dir" add -A docs
          if git -C "$publish_dir" diff --cached --quiet && [ "$FORCE_PUBLISH" != "true" ]; then
            echo 'Published site is already current.'
            exit 0
          fi
          git -C "$publish_dir" config user.name 'github-actions[bot]'
          git -C "$publish_dir" config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git -C "$publish_dir" diff --cached --quiet; then
            git -C "$publish_dir" commit --allow-empty -m 'Republish rope calendar'
          else
            git -C "$publish_dir" commit -m 'Publish rope calendar'
          fi
          git -C "$publish_dir" push origin HEAD:gh-pages
          published_sha="$(git -C "$publish_dir" rev-parse HEAD)"
          page_status=''
          for attempt in $(seq 1 12); do
            page_status="$(gh api "repos/$GITHUB_REPOSITORY/pages/deployments/$published_sha" --jq '.status' 2>/dev/null || true)"
            [ -n "$page_status" ] && break
            sleep 5
          done
          if [ -z "$page_status" ]; then
            gh api -X POST "repos/$GITHUB_REPOSITORY/pages/builds" >/dev/null
          fi
          for attempt in $(seq 1 60); do
            page_status="$(gh api "repos/$GITHUB_REPOSITORY/pages/deployments/$published_sha" --jq '.status' 2>/dev/null || true)"
            case "$page_status" in
              succeed)
                echo 'GitHub Pages published successfully.'
                exit 0
                ;;
              failed|deployment_cancelled)
                echo "::error::GitHub Pages deployment ended with status $page_status."
                exit 1
                ;;
            esac
            sleep 10
          done
          echo '::error::GitHub Pages did not confirm deployment within 10 minutes.'
          exit 1
