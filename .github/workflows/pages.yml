name: Publish rope calendar

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Check Monday updates from 10:30 to 18:30 Asia/Shanghai.
    - cron: '30 2-10 * * 1'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Sync catalog and regulation files
        run: npm run sync
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
      - name: Save complete updated catalog
        run: |
          if [ -n "$(git status --porcelain -- public src/data/seed.json)" ]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add public src/data/seed.json
            git commit -m 'Update competition calendar and regulation files'
            git push
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
